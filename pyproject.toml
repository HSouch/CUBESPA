[build-system]
requires = ["setuptools >= 77.0.3"]

[project]
dynamic = ["version"]
name = "cubespa"
description="Spectral cube processing and rendering made easy."
readme="README.md"

authors = [
    {name = "Harrison Souchereau", email = "harrison.souchereau@yale.edu"}
]

maintainers = [
    {name = "Harrison Souchereau", email = "harrison.souchereau@yale.edu"}
]

classifiers = [
    "Development Status :: 4 - Beta",
]

dependencies = [
    "astropy",
    "numpy",
    "photutils",
    "reproject",
    "matplotlib",
    "pvextractor",
    "maskmoment",
]

requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cubespa*"]


[tool.setuptools.dynamic]
version = {attr = "cubespa.__version__"}
