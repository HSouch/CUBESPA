[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubespa"
version = "0.0.9"
description = "A short description of the project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["example"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "astropy",
    "numpy",
    "photutils",
    "reproject",
    "matplotlib",
    "pvextractor",
    "maskmoment",
]


[project.urls]
# Homepage = "https://github.com/username/my-project"
#Documentation = "https://github.com/username/my-project#readme"
#Repository = "https://github.com/username/my-project.git"
#Issues = "https://github.com/username/my-project/issues"

[tool.setuptools]
packages = ["cubespa"]